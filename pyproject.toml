[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surge-pipeline"
version = "0.1.0"
description = "Surge-labelling pipeline for social-media trend prediction"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "textblob>=0.17",
    "vaderSentiment>=3.3",
    "xgboost>=1.7",
    "joblib>=1.2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
surge-label = "run_labeling:main"
surge-train = "run_training:main"
surge-cross-val = "run_cross_validation:main"
surge-figures = "generate_figures:main"
surge-examples = "generate_prediction_examples:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
