[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surge-pipeline"
version = "0.1.0"
description = "Surge-labelling pipeline for social-media trend prediction"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "textblob>=0.17",
    "vaderSentiment>=3.3",
    "xgboost>=1.7",
    "joblib>=1.2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pandas-stubs>=2.0",
]

[project.scripts]
surge-label = "run_labeling:main"
surge-train = "run_training:main"
surge-cross-val = "run_cross_validation:main"
surge-figures = "generate_figures:main"
surge-examples = "generate_prediction_examples:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

# =============================================================================
# Ruff — linting and formatting
# =============================================================================

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python idioms)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B905",   # zip without strict= (python 3.10+ only)
    "SIM108", # ternary operator suggestion (readability preference)
    "SIM115", # context manager for open() (not always applicable)
    "RUF001", # ambiguous unicode in strings (intentional math notation: σ, μ, ×)
    "RUF002", # ambiguous unicode in docstrings (intentional math notation)
    "RUF003", # ambiguous unicode in comments (intentional math notation)
]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["E501", "B011", "SIM300", "E712", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["surge_pipeline"]

# =============================================================================
# Mypy — static type checking
# =============================================================================

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["surge_pipeline"]
strict = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Per-module overrides for pandas/numpy stub limitations
[[tool.mypy.overrides]]
module = [
    "surge_pipeline.labelling",
    "surge_pipeline.sentiment",
    "surge_pipeline.features",
    "surge_pipeline.evaluation_figures",
    "surge_pipeline.loader",
    "surge_pipeline.evaluation",
]
disable_error_code = ["operator", "index", "union-attr", "assignment", "arg-type", "return-value"]
